# models/manifest.toml — Attested Machine Learning Models Manifest for soos
# Each model deployed to /var/lib/soos/models/ or models/ must be attested by this manifest.
# ModelRegistry verifies SHA-256 integrity prior to ONNX Runtime session creation, then checks
# the session's I/O tensor shapes against `input_shape`, `input_layout` and `output_shapes`
# (symbolic dims in the graph are wildcards) before the session is used.
#
# `input_shape` is always the logical [N, C, H, W] shape. `input_layout` (default "NCHW")
# is the physical layout of the graph input; "NHWC" means the tensor is [N, H, W, C].
#
# `size_bytes` (optional) is the exact byte size of the attested file. scripts/download_models.sh
# prints it, bounds the download with it and discards a file of any other size before hashing
# (GitHub #269). The SHA-256 remains the attestation; the size is an early, fail-closed check.
#
# Model ids and file names are stable identifiers, not descriptions. The embedding model is
# OpenCV Zoo SFace 2021dec (`sface_2021dec`, owner decision 2026-10-01, GitHub #278); the retired
# ArcFace ResNet34 is attested only in models/retired_models.toml, which
# no runtime crate reads (AI/DECISIONS.md, ADR "SFace Embedding Model Replaces ArcFace ResNet34").

[manifest]
version = "2.0.0"

[models.scrfd_500m_kps]
id = "scrfd_500m_kps"
filename = "scrfd_500m_kps.onnx"
sha256 = "a3562ef62592bf387f6ef19151282ac127518e51c77696e62e0661bee95ba1ad"
size_bytes = 2524155
license = "MIT"
source_url = "https://huggingface.co/ykk648/face_lib/resolve/10005fec5e0fec7c186e3b96318f00b4807fc70b/face_detect/scrfd_onnx/scrfd_500m_bnkps.onnx"
description = "SCRFD 500M KPS unified face detection and 5-point facial landmarks"
input_shape = [1, 3, 640, 640]
output_shapes = [
    [1, 12800, 1],
    [1, 3200, 1],
    [1, 800, 1],
    [1, 12800, 4],
    [1, 3200, 4],
    [1, 800, 4],
    [1, 12800, 10],
    [1, 3200, 10],
    [1, 800, 10],
]

[models.sface_2021dec]
id = "sface_2021dec"
filename = "sface_2021dec.onnx"
sha256 = "0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79"
size_bytes = 38696353
# OpenCV Zoo SFace: "All files are licensed under Apache 2.0 License" (opencv_zoo README and
# LICENSE). The training data of this file is undocumented upstream (opencv_zoo issue #318);
# owner-accepted risk, AI/DECISIONS.md. Pinned Hugging Face revision, never a branch name.
license = "Apache-2.0"
source_url = "https://huggingface.co/opencv/face_recognition_sface/resolve/3d7082438a6e4551e840c9b2bb60b71e8da4b524/face_recognition_sface_2021dec.onnx"
description = "OpenCV Zoo SFace 2021dec (MobileFaceNet backbone, SFace loss) 128D face embedding extractor; NCHW data [1,3,112,112], RGB raw 0..255, in-graph (x-127.5)/128"
input_shape = [1, 3, 112, 112]
input_layout = "NCHW"
output_shapes = [[1, 128]]

[models.minifasnet_v2_pad]
id = "minifasnet_v2_pad"
filename = "minifasnet_v2_80x80.onnx"
sha256 = "0cbe5caec95c31de9d2ef845cb85407d76aecd1b6a2c0e343f7d35306bfbccb8"
size_bytes = 1744126
license = "Apache-2.0"
source_url = "https://github.com/QingHeYang/Silent-Face-Anti-Spoofing-onnx/raw/584d4421d7ac42c59e640796f46e886b0095367a/onnx/2.7_80x80_MiniFASNetV2.onnx"
description = "MiniFASNetV2 80x80 presentation attack detection (anti-spoofing)"
input_shape = [1, 3, 80, 80]
output_shapes = [[1, 3]]
