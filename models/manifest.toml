# models/manifest.toml — Attested Machine Learning Models Manifest for soos
# Each model deployed to /var/lib/soos/models/ or models/ must be attested by this manifest.
# ModelRegistry verifies SHA-256 integrity prior to ONNX Runtime session creation.

[manifest]
version = "2.0.0"

[models.scrfd_500m_kps]
id = "scrfd_500m_kps"
filename = "scrfd_500m_kps.onnx"
sha256 = "a3562ef62592bf387f6ef19151282ac127518e51c77696e62e0661bee95ba1ad"
license = "MIT"
source_url = "https://huggingface.co/ykk648/face_lib/resolve/main/face_detect/scrfd_onnx/scrfd_500m_bnkps.onnx"
description = "SCRFD 500M KPS unified face detection and 5-point facial landmarks"
input_shape = [1, 3, 640, 640]
output_shapes = [
    [1, 12800, 1],
    [1, 3200, 1],
    [1, 800, 1],
    [1, 12800, 4],
    [1, 3200, 4],
    [1, 800, 4],
    [1, 12800, 10],
    [1, 3200, 10],
    [1, 800, 10],
]

[models.arcface_w600k_mbf]
id = "arcface_w600k_mbf"
filename = "arcface_w600k_mbf.onnx"
sha256 = "ffe014a45c9488506719d37fd578ece6661bb385535b36e8039975fa5d4683db"
license = "MIT"
source_url = "https://huggingface.co/garavv/arcface-onnx/resolve/main/arc.onnx"
description = "ArcFace MobileFaceNet w600k 512D biometric embedding extractor"
input_shape = [1, 3, 112, 112]
output_shapes = [[1, 512]]

[models.minifasnet_v2_pad]
id = "minifasnet_v2_pad"
filename = "minifasnet_v2_80x80.onnx"
sha256 = "0cbe5caec95c31de9d2ef845cb85407d76aecd1b6a2c0e343f7d35306bfbccb8"
license = "Apache-2.0"
source_url = "https://github.com/QingHeYang/Silent-Face-Anti-Spoofing-onnx/raw/main/onnx/2.7_80x80_MiniFASNetV2.onnx"
description = "MiniFASNetV2 80x80 presentation attack detection (anti-spoofing)"
input_shape = [1, 3, 80, 80]
output_shapes = [[1, 3]]
