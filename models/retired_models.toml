# models/retired_models.toml — Retired model attestations kept for evaluation only
#
# Nothing in this file is read by soos-daemon, soos-enroll, soos-gui, scripts/download_models.sh
# or scripts/install.sh (invariant embedding_model_docs_contract). It keeps the unchanged
# attestation of a model that the shipped models/manifest.toml no longer declares, so that the
# evaluation tests that measured it stay reproducible against the exact file:
#
#   - crates/inference-ort/tests/embedding_preprocessing_evaluation_tests.rs (walkthrough 145)
#   - crates/vision/tests/embedding_lfw_evaluation_tests.rs (walkthrough 160, ArcFace variants)
#
# arcface_w600k_mbf was the embedding model until the owner decision of 2026-10-01 (GitHub #278,
# walkthrough 162): it was replaced by OpenCV Zoo SFace 2021dec (`sface_2021dec`). Templates
# recorded with it are Foreign to the shipped daemon (Unavailable, password fallback) until the
# user re-enrolls. An installed /var/lib/soos/models/arcface_w600k_mbf.onnx is unused and may be
# deleted; scripts/download_models.sh reports it as not attested.

[manifest]
version = "2.0.0"

[models.arcface_w600k_mbf]
id = "arcface_w600k_mbf"
filename = "arcface_w600k_mbf.onnx"
sha256 = "ffe014a45c9488506719d37fd578ece6661bb385535b36e8039975fa5d4683db"
size_bytes = 136619444
# The source repository (garavv/arcface-onnx, revision 224c23c) declares no licence, so the
# licence is recorded as the SPDX "NOASSERTION" value (GitHub #278, AI/DECISIONS.md).
license = "NOASSERTION"
source_url = "https://huggingface.co/garavv/arcface-onnx/resolve/224c23cbbdc27a22add7fa538dee5b2aa9304b83/arc.onnx"
description = "Retired: ArcFace ResNet34 (Keras, tf2onnx export, ~34.1M params, 136.6 MB) 512D face embedding extractor; NHWC input_1 [N,112,112,3]"
input_shape = [1, 3, 112, 112]
input_layout = "NHWC"
output_shapes = [[1, 512]]
