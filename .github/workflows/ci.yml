# =============================================================================
# CI/CD — Verification Pipeline for the soos Project
# =============================================================================
# This workflow runs on every push and pull request against the main branch.
# It enforces the exact quality and security pipeline from save.sh:
#
# Jobs:
#   1. quality  — fmt, clippy, unit & invariant tests, candid review
#   2. security — cargo-deny (licenses, advisories, sources, bans)
#   3. pam-integration — PAM integration tests in isolated Docker container
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Code Quality & Architectural Invariants (Mirrors save.sh)
  # ---------------------------------------------------------------------------
  quality:
    name: "Quality (fmt + clippy + test + candid)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: "Step 1/4 — cargo fmt --check"
        run: cargo fmt --all -- --check

      - name: "Step 2/4 — cargo clippy -- -D warnings"
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: "Step 3/4 — cargo test"
        run: cargo test --all-targets --all-features

      - name: "Step 4/4 — candid review"
        run: ./scripts/candid_review.sh

  # ---------------------------------------------------------------------------
  # Job 2: Dependency Supply Chain Security Audit
  # ---------------------------------------------------------------------------
  security:
    name: "Security (cargo-deny)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ---------------------------------------------------------------------------
  # Job 3: PAM Integration Tests (Isolated Docker Container)
  # ---------------------------------------------------------------------------
  pam-integration:
    name: "PAM Integration (Docker)"
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker sandbox
        run: docker build -t soos-sandbox .

      - name: Run PAM integration tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            soos-sandbox \
            bash /workspace/tests/docker/test_suite.sh
