# =============================================================================
# CI/CD — Verification Pipeline for the soos Project
# =============================================================================
# Runs on every pull request against main, every push to main, daily (supply
# chain advisories only) and on manual dispatch. Commands are identical to
# save.sh so that a green local run predicts a green CI run.
#
# Jobs (parallel unless noted):
#   1. lint            — fmt, shell syntax/shellcheck, candid review layers 1+2,
#                        per-commit secret scan (no compilation)
#   2. clippy          — cargo clippy -D warnings (all targets, all features)
#   3. test            — cargo test (unit, integration, invariant suites)
#   4. security        — cargo-deny (advisories, licenses, sources, bans)
#   5. pam-integration — Dockerized PAM matrix T1–T15 (after lint)
#   6. authselect-profile — Fedora authselect profile activation and rollback
#                        in fedora:40 (after lint)
#   6b. pam-rollback   — Debian stack order + byte-for-byte PAM rollback
#                        in ubuntu:24.04 and fedora:40 (after lint)
#   6c. package-deploy — Ubuntu .deb build, dpkg install, enrollment, password
#                        fallback, rollback and package content checks in
#                        ubuntu:24.04 (after lint)
#   6d. systemd-unit   — soos-daemon.service driven by a real systemd (PID 1)
#                        in ubuntu:24.04 (after lint)
#   7. ci-success      — single aggregate status for merge gating
#   8. distro-pam-matrix — PAM matrix T1–T15 in the Fedora and Arch sandbox
#                        images (push to main and manual dispatch only)
#   9. distro-deploy   — Fedora (.rpm, authselect) and Arch (pacman) deployment
#                        and package harness (push to main and manual dispatch)
# The PR title convention is checked by pr-title.yml (it must also re-run when
# a PR is retitled, which would needlessly re-run this whole pipeline).
#
# Hardening: read-only token, third-party actions pinned to full commit SHAs,
# no persisted git credentials, untrusted event data passed through env only,
# Cargo.lock enforced (--locked), per-job timeouts.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily RustSec advisory scan: new vulnerabilities surface without code changes.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per PR (superseded runs are cancelled); every other run gets its own
  # group keyed by event and commit, so runs on main are never cancelled or dropped.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1
  # CI needs no debuginfo: smaller target dir, faster links, smaller caches.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Fast static gates (no compilation, ~1 min)
  # ---------------------------------------------------------------------------
  lint:
    name: "Lint (fmt + scripts + candid + secrets)"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Shell syntax and ShellCheck (errors)
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' '.githooks/*')
          for f in "${scripts[@]}"; do bash -n "$f"; done
          shellcheck --version | head -2
          shellcheck --severity=error "${scripts[@]}"

      - name: Candid review — layer 1 (deterministic invariants)
        run: ./scripts/candid_review.sh

      - name: Candid review — layer 2 (fingerprint-bound report)
        # No bot exemption: actor checks are spoofable, and every merged diff is reviewed.
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/candid_subagent.sh --rev "$HEAD_SHA" --skip-layer1

      - name: Secret and sensitive artifact scan (every commit in range)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$(git merge-base origin/main "$PR_HEAD_SHA")..$PR_HEAD_SHA"
          elif [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$GITHUB_SHA"
          else
            echo "Scanning the full history of $GITHUB_SHA"
            exec ./scripts/secret_scan.sh --history "$GITHUB_SHA"
          fi
          echo "Scanning $range"
          ./scripts/secret_scan.sh --range "$range"

  # ---------------------------------------------------------------------------
  # Job 2: Clippy (metadata-only build, cached)
  # ---------------------------------------------------------------------------
  clippy:
    name: "Clippy (-D warnings)"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal && rustc --version && cargo clippy --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes caches; PRs restore them (avoids cache thrash and poisoning).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # ONNX Runtime prebuilt download of ort-sys (GitHub #318): restored from a
      # Cargo.lock-keyed cache (only main writes it), then fetched with a bounded
      # retry. ort-sys verifies the SHA-256 of every download before extracting it.
      - name: ONNX Runtime cache location
        run: echo "ORT_CACHE_DIR=${HOME}/.cache/ort.pyke.io" >> "$GITHUB_ENV"

      - name: Restore the ONNX Runtime download cache
        id: ort-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Prefetch ONNX Runtime (bounded retry)
        run: ./scripts/prefetch_onnxruntime.sh

      - name: Save the ONNX Runtime download cache
        if: github.ref == 'refs/heads/main' && steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # 32-bit type check (GitHub #291): `time_t` / `tv_sec` are 32-bit on i686, so width
      # assumptions in the 64-bit build compile here or fail. Nothing is linked, so the ONNX
      # Runtime download (no i686 binaries) is skipped. `v4l2-sys-mit` runs bindgen on
      # <linux/videodev2.h> for the target, which needs the 32-bit libc headers (gcc-multilib).
      - name: 32-bit type check (i686)
        env:
          ORT_SKIP_DOWNLOAD: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib
          rustup target add i686-unknown-linux-gnu
          cargo check --locked --workspace --all-targets --all-features --target i686-unknown-linux-gnu

  # ---------------------------------------------------------------------------
  # Job 3: Tests (unit, integration, property, architectural invariants)
  # ---------------------------------------------------------------------------
  test:
    name: "Test (unit + integration + invariants)"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # ONNX Runtime prebuilt download of ort-sys (GitHub #318): restored from a
      # Cargo.lock-keyed cache (only main writes it), then fetched with a bounded
      # retry. ort-sys verifies the SHA-256 of every download before extracting it.
      - name: ONNX Runtime cache location
        run: echo "ORT_CACHE_DIR=${HOME}/.cache/ort.pyke.io" >> "$GITHUB_ENV"

      - name: Restore the ONNX Runtime download cache
        id: ort-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Prefetch ONNX Runtime (bounded retry)
        run: ./scripts/prefetch_onnxruntime.sh

      - name: Save the ONNX Runtime download cache
        if: github.ref == 'refs/heads/main' && steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # The RLC-S1 invariant runs `cargo tree --offline --target all` (GitHub #345):
      # the build only downloads host-target crates, so fetch every target's crates
      # (for example android-activity) before the offline dependency checks.
      - name: Fetch dependencies for every target
        run: cargo fetch --locked

      - name: Build test binaries
        run: cargo test --locked --workspace --all-targets --all-features --no-run

      - name: cargo test
        run: cargo test --locked --workspace --all-targets --all-features

      # Wall-clock latency benchmarks are gated behind SOOS_LATENCY_BENCH=1 so a loaded
      # developer machine never fails them; they run here single-threaded (GitHub #280).
      - name: Latency benchmarks (single-threaded)
        env:
          SOOS_LATENCY_BENCH: "1"
        run: |
          cargo test --locked --all-features -p soos-vision --test bench_tests -- --test-threads=1
          cargo test --locked --all-features -p soos-camera-v4l --test shutdown_tests -- --test-threads=1

  # ---------------------------------------------------------------------------
  # Job 4: Dependency supply chain audit (also runs daily on schedule)
  # ---------------------------------------------------------------------------
  security:
    name: "Security (cargo-deny)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny (prebuilt, checksum-verified)
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check
        run: cargo deny --locked check

  # ---------------------------------------------------------------------------
  # Job 5: PAM integration tests in an isolated, cached Docker sandbox
  # ---------------------------------------------------------------------------
  pam-integration:
    name: "PAM Integration (Docker)"
    if: github.event_name != 'schedule'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker sandbox (layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: soos-sandbox:ci
          cache-from: type=gha,scope=pam-sandbox
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=pam-sandbox' || '' }}

      - name: Run PAM integration tests (T1–T15)
        run: |
          docker run --rm \
            -e SOOS_REQUIRE_TOOLCHAIN_SYNC=1 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v soos-sandbox-target:/workspace/target \
            soos-sandbox:ci \
            bash /workspace/tests/docker/test_suite.sh

  # ---------------------------------------------------------------------------
  # Job 6: Fedora authselect profile — activation, generated PAM/NSS files,
  # password fallback and rollback in a stock fedora:40 container (GitHub #145)
  # ---------------------------------------------------------------------------
  authselect-profile:
    name: "Fedora authselect profile (Docker)"
    if: github.event_name != 'schedule'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Activate, validate and roll back custom/soos in fedora:40
        run: ./tests/docker/authselect_profile_test.sh

  # ---------------------------------------------------------------------------
  # Job 6b: PAM activation order and byte-for-byte uninstall rollback on
  # ubuntu:24.04 and fedora:40 (GitHub #161, #166)
  # ---------------------------------------------------------------------------
  pam-rollback:
    name: "PAM activation & rollback (Docker)"
    if: github.event_name != 'schedule'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate stack order and rollback on ubuntu:24.04 and fedora:40
        run: ./tests/docker/pam_rollback_test.sh

  # ---------------------------------------------------------------------------
  # Job 6d: packaging/soos-daemon.service under a real systemd (PID 1) in a
  # privileged ubuntu:24.04 container (GitHub #211): fresh release daemon
  # installed by scripts/install.sh, systemd-analyze verify, condition failed
  # without models (also at boot), start-limit-hit after 5 failed starts,
  # Type=notify readiness with the attested models (downloaded and SHA-256
  # verified by scripts/download_models.sh) and a clean stop.
  # ---------------------------------------------------------------------------
  systemd-unit:
    name: "systemd unit acceptance (Docker)"
    if: github.event_name != 'schedule'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ONNX Runtime prebuilt download of ort-sys (GitHub #318): the host cache
      # directory is handed to the Docker harness (SOOS_ORT_CACHE_DIR), restored
      # from a Cargo.lock-keyed cache and saved by main only; the harness fetches
      # with a bounded retry. ort-sys verifies the SHA-256 of every download.
      - name: ONNX Runtime cache location
        run: |
          mkdir -p "${HOME}/.cache/ort.pyke.io"
          echo "SOOS_ORT_CACHE_DIR=${HOME}/.cache/ort.pyke.io" >> "$GITHUB_ENV"

      - name: Restore the ONNX Runtime download cache
        id: ort-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Drive soos-daemon.service with systemd as PID 1 (ubuntu:24.04)
        run: ./tests/docker/systemd_unit_acceptance_test.sh --models download

      - name: Save the ONNX Runtime download cache
        if: github.ref == 'refs/heads/main' && steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

  # ---------------------------------------------------------------------------
  # Job 6c: Ubuntu packaging and deployment path (GitHub #168). Builds the
  # release workspace and the .deb in ubuntu:24.04, installs it with dpkg,
  # enrolls through soos-enroll --mock, checks facial auth, password fallback
  # and rollback (tests/distro/debian_ubuntu_test.sh), then re-uses the same
  # per-distro target volume for the package content, key isolation and
  # removal harness (tests/docker/test_packages.sh).
  # ---------------------------------------------------------------------------
  package-deploy:
    name: "Package deployment (ubuntu, Docker)"
    if: github.event_name != 'schedule'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ONNX Runtime prebuilt download of ort-sys (GitHub #318): the host cache
      # directory is handed to the Docker harness (SOOS_ORT_CACHE_DIR), restored
      # from a Cargo.lock-keyed cache and saved by main only; the harness fetches
      # with a bounded retry. ort-sys verifies the SHA-256 of every download.
      - name: ONNX Runtime cache location
        run: |
          mkdir -p "${HOME}/.cache/ort.pyke.io"
          echo "SOOS_ORT_CACHE_DIR=${HOME}/.cache/ort.pyke.io" >> "$GITHUB_ENV"

      - name: Restore the ONNX Runtime download cache
        id: ort-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Deploy the .deb, enroll, fall back to password and roll back (ubuntu:24.04)
        run: ./tests/distro/run_distro_validation.sh ubuntu

      - name: Save the ONNX Runtime download cache
        if: github.ref == 'refs/heads/main' && steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Package content, key isolation and removal (tests/docker/test_packages.sh)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v soos-distro-target-ubuntu:/workspace/target \
            soos-distro-val-ubuntu \
            bash /workspace/tests/docker/test_packages.sh

  # ---------------------------------------------------------------------------
  # Job 8: PAM matrix T1–T15 in the Fedora and Arch sandbox images (GitHub #162).
  # Each image rebuilds its toolchain and pam_soos.so, so it runs on push to
  # main and on manual dispatch rather than on every pull request; the static
  # half (PAM stacks rebuilt under bash and parsed) runs on every PR in `test`.
  # Not part of CI Success because it is skipped on pull requests.
  # ---------------------------------------------------------------------------
  distro-pam-matrix:
    name: "PAM Matrix (${{ matrix.distro }})"
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora, arch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run PAM matrix T1–T15 in the distro sandbox
        env:
          DISTRO: ${{ matrix.distro }}
        run: ./tests/docker/run_matrix.sh "$DISTRO"

  # ---------------------------------------------------------------------------
  # Job 9: Fedora and Arch deployment paths (GitHub #274, review ONB-10b).
  # Fedora: release build, RPM built with rpmbuild and installed with rpm -i,
  # authselect custom/soos activation with pam_faillock preserved, enrollment
  # through soos-enroll --mock, facial auth, password fallback and rollback
  # (tests/distro/fedora_rhel_test.sh). Arch: package built by build_arch.sh and
  # installed with pacman -U, system-auth / screen-locker stacks, enrollment and
  # pacman rollback (tests/distro/arch_linux_test.sh). Both then run the RPM or
  # Arch branch of tests/docker/test_packages.sh in the same image and target
  # volume. Full release builds per image, so push to main and manual dispatch
  # only; not part of CI Success because it is skipped on pull requests.
  # ---------------------------------------------------------------------------
  distro-deploy:
    name: "Package deployment (${{ matrix.distro }}, Docker)"
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora, arch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy the native package, enroll, fall back to password and roll back
        env:
          DISTRO: ${{ matrix.distro }}
        run: ./tests/distro/run_distro_validation.sh "$DISTRO"

      - name: Package content, key isolation and removal (tests/docker/test_packages.sh)
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "soos-distro-target-${DISTRO}":/workspace/target \
            "soos-distro-val-${DISTRO}" \
            bash /workspace/tests/docker/test_packages.sh

  # ---------------------------------------------------------------------------
  # Job 7: Aggregate status (single required check for merge gating)
  # ---------------------------------------------------------------------------
  ci-success:
    name: "CI Success"
    if: always() && github.event_name != 'schedule'
    needs: [lint, clippy, test, security, pam-integration, authselect-profile, pam-rollback, package-deploy, systemd-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" != "success" ]]; then
              echo "::error::At least one required job did not succeed ($r)."
              exit 1
            fi
          done
