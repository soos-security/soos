# soos face-scan state for hyprlock (GitHub #401, Docs/LOCKSCREEN_WIDGET.md).
#
# Append this block to ~/.config/hypr/hyprlock.conf. It shows the brand star while idle, a
# turning quarter arc and "Scanning" during a face scan (a PAM face request or a presence scan),
# and "Not recognized" after a failed scan. Nothing else is ever shown: every failure reason and
# every transport error collapse into those three states.
#
# soos-lockstatus --once exits within 300 ms, never writes to stderr and prints the idle
# rendering when the daemon cannot be asked. All lock-status clients of one user use at most one
# daemon connection at a time and share a 250 ms cache in $XDG_RUNTIME_DIR, so any number of
# monitors is safe.
# Keep update:500 or slower. Add --reduce-motion (or export SOOS_REDUCE_MOTION=1) for a static
# glyph.
#
# Requires soos-lockstatus on the PATH of hyprlock (for example ~/.local/bin) and membership of
# the soos group (the same requirement as face unlock itself).

label {
    monitor =
    text = cmd[update:500] soos-lockstatus --once --format label
    color = rgba(237, 241, 255, 1.0)
    font_size = 18
    position = 0, -160
    halign = center
    valign = center
}
