[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/pam",
    "tests/invariants",
]

# Centralized versions across workspace
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Mysticaly622/soos"
publish = false

[workspace.dependencies]
# IPC binary serialization (compact, bounded)
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# Memory zeroization
zeroize = { version = "1.9", features = ["derive"] }

# Internal workspace crates
soos-protocol = { path = "crates/protocol", version = "0.1.0" }
