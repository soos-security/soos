[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/pam",
    "crates/policy",
    "crates/daemon",
    "crates/camera-v4l",
    "crates/inference-ort",
    "crates/vision",
    "crates/biometric-store",
    "crates/evidence-store",
    "crates/enrollment-cli",
    "crates/admin-cli",
    "crates/gui",
    "crates/remote",
    "crates/push-protocol",
    "crates/push-sender",
    "tests/invariants",
    "tests/fixtures",
]

# Centralized versions across workspace
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Mysticaly622/soos"
publish = false

[workspace.dependencies]
# IPC binary serialization (compact, bounded)
serde = { version = "1", features = ["derive"] }
# float_roundtrip: diagnostic JSON (soos-admin test-pam latencies) must parse back to the
# exact f64 that was printed (GitHub #291, CDF2).
serde_json = { version = "1", features = ["float_roundtrip"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# Memory zeroization
zeroize = { version = "1.9", features = ["derive"] }

# Asynchronous runtime and Unix networking
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "io-util"] }
nix = { version = "0.29", features = ["socket", "fs", "user"] }

# Camera capture & lock-free frame swapping
v4l = "0.14"
arc-swap = "1"

# ONNX Runtime & Machine Learning
# Exact pin: ort 2.0 is still a release candidate and pre-release APIs may change
# between rc versions. Upgrade deliberately (real-model tests) once 2.0.0 GA ships.
ort = "=2.0.0-rc.13"
sha2 = "0.10"
toml = "0.8"

# systemd-logind client of the presence auto-unlock (soos-daemon, GitHub #323) and of the
# remote companion soos-remote (GitHub #339, ADR 2026-10-05 item 7)
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Minimal bounded HTTP/1.1 request-head parser of soos-remote (GitHub #339; already locked
# through ureq, no hyper/axum)
httparse = "1.10"

# Logging and diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Error management
thiserror = "2"

# Test utilities
tempfile = "3"

# Low-level primitives & random generation
getrandom = "0.4"
libc = "0.2"
pam_bindings = { package = "pam-bindings", version = "0.3.0" }

jpeg-decoder = { version = "0.3", default-features = false }

# Cryptography & binary serialization
aes-gcm = "0.10"
ciborium = "0.2"
# WebAuthn ES256 verification of soos-remote (ADR 2026-10-06 "Tailscale Funnel Access and
# In-House Passkey Authentication"): RustCrypto only, no OpenSSL
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
base64ct = { version = "1.8", features = ["alloc"] }
subtle = "2.6"
# Web Push (ADR 2026-10-06 "Web Push Notifications for Failed-Password Alerts Through a
# Separate Sender Unit"): RFC 8291 HKDF steps in soos-remote (RustCrypto, already locked)
hmac = "0.12"
# Outbound HTTPS of soos-push-sender only: rustls + ring + webpki-roots, no OpenSSL,
# exact pin (the resolver API is unversioned in ureq 3)
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Internal workspace crates
soos-protocol = { path = "crates/protocol", version = "0.1.0" }
soos-policy = { path = "crates/policy", version = "0.1.0" }
soos-daemon = { path = "crates/daemon", version = "0.1.0" }
soos-camera-v4l = { path = "crates/camera-v4l", version = "0.1.0" }
soos-test-fixtures = { path = "tests/fixtures", version = "0.1.0" }
soos-inference-ort = { path = "crates/inference-ort", version = "0.1.0" }
soos-vision = { path = "crates/vision", version = "0.1.0" }
soos-biometric-store = { path = "crates/biometric-store", version = "0.1.0" }
soos-evidence-store = { path = "crates/evidence-store", version = "0.1.0" }
soos-enrollment-cli = { path = "crates/enrollment-cli", version = "0.1.0" }
soos-admin-cli = { path = "crates/admin-cli", version = "0.1.0" }
soos-gui = { path = "crates/gui", version = "0.1.0" }
soos-remote = { path = "crates/remote", version = "0.1.0" }
soos-push-protocol = { path = "crates/push-protocol", version = "0.1.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# Disallow panics and unfinished code in production
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

# Memory and unsafe block documentation
undocumented_unsafe_blocks = "deny"
mem_forget = "deny"

# I/O restrictions (prevent leaking info or corrupting PAM caller output)
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Code quality & transparency
allow_attributes_without_reason = "deny"
fallible_impl_from = "deny"

# Security & numerical warnings
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# MUST stay "unwind" (ADR 2026-09-29, review finding PAM-01 / GitHub #148): every
# packaging path builds pam_soos.so with this profile, and under panic = "abort"
# catch_unwind in the module is a no-op, so any panic (including an overflow
# trapped by overflow-checks) would kill gdm/sudo/login instead of degrading to
# PAM_IGNORE. Enforced by tests/invariants and Docker matrix case T10.
panic = "unwind"
overflow-checks = true
strip = "symbols"

[profile.dev]
overflow-checks = true
debug = 1

[profile.test]
overflow-checks = true
debug = 1
