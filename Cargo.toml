[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/pam",
    "crates/policy",
    "crates/daemon",
    "crates/camera-v4l",
    "tests/invariants",
]

# Centralized versions across workspace
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Mysticaly622/soos"
publish = false

[workspace.dependencies]
# IPC binary serialization (compact, bounded)
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# Memory zeroization
zeroize = { version = "1.9", features = ["derive"] }

# Asynchronous runtime and Unix networking
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "io-util"] }
nix = { version = "0.29", features = ["socket", "fs", "user"] }

# Camera capture & lock-free frame swapping
v4l = "0.14"
arc-swap = "1"

# Logging and diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Error management
thiserror = "2"

# Test utilities
tempfile = "3"

# Low-level primitives & random generation
getrandom = "0.3"
libc = "0.2"

# Internal workspace crates
soos-protocol = { path = "crates/protocol", version = "0.1.0" }
soos-policy = { path = "crates/policy", version = "0.1.0" }
soos-daemon = { path = "crates/daemon", version = "0.1.0" }
soos-camera-v4l = { path = "crates/camera-v4l", version = "0.1.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# Disallow panics and unfinished code in production
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

# Memory and unsafe block documentation
undocumented_unsafe_blocks = "deny"
mem_forget = "deny"

# I/O restrictions (prevent leaking info or corrupting PAM caller output)
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Code quality & transparency
allow_attributes_without_reason = "deny"
fallible_impl_from = "deny"

# Security & numerical warnings
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = "symbols"

[profile.dev]
overflow-checks = true
