[package]
name = "soos-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["download-binaries"]
download-binaries = ["soos-inference-ort/download-binaries", "soos-vision/download-binaries", "soos-enrollment-cli/download-binaries"]
system-onnxruntime = ["soos-inference-ort/system-onnxruntime", "soos-vision/system-onnxruntime", "soos-enrollment-cli/system-onnxruntime"]

[dependencies]
soos-protocol = { workspace = true }
soos-policy = { workspace = true }
soos-camera-v4l = { workspace = true }
soos-inference-ort = { workspace = true }
soos-vision = { workspace = true }
soos-biometric-store = { workspace = true }
soos-enrollment-cli = { workspace = true }

clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
arc-swap = { workspace = true }
nix = { workspace = true, features = ["time"] }
serde_json = { workspace = true }
getrandom = { workspace = true }

eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[features]
# Dev-only README screenshot capture (GitHub #381, ADR 2026-10-13 "README Assets Are Generated
# From Synthetic Data, Never Hand-Edited"): exposes `soos_gui::app::capture`, the synthetic
# scene builder used by `tests/readme_snapshots.rs`. Never a default feature, never enabled by
# packaging or install scripts (enforced by tests/invariants readme_assets_contract).
readme-capture = []

[dev-dependencies]
tempfile = { workspace = true }
soos-test-fixtures = { workspace = true }
soos-frame = { workspace = true }
png = "0.18"

[lints]
workspace = true
