[package]
name = "soos-remote"
description = "User-level remote companion of soos: real-time lock status and remote lock over a Unix socket behind Tailscale Serve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "soos-remote"
path = "src/main.rs"

[lib]
name = "soos_remote"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
nix = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
httparse = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
proptest = "1"

[lints]
workspace = true
