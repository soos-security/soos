[package]
name = "soos-pam"
description = "PAM module pam_soos.so — synchronous IPC client to the soos daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "pam_soos"
# cdylib produces a .so dynamically loadable by Linux-PAM; rlib enables integration tests
crate-type = ["cdylib", "rlib"]

[dependencies]
soos-protocol = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
pam_bindings = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]

[lints]
workspace = true
