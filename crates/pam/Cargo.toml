[package]
name = "soos-pam"
description = "PAM module pam_soos.so — synchronous IPC client to the soos daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "pam_soos"
# cdylib produces a .so dynamically loadable by Linux-PAM; rlib enables integration tests
crate-type = ["cdylib", "rlib"]

[features]
# Test-only hook (review finding PAM-01, GitHub #148): adds the PAM argument
# `fault_inject=<panic|overflow>` that deliberately panics inside the catch_unwind
# region so the Docker matrix (T10) can prove that the RELEASE-built .so degrades
# to PAM_IGNORE instead of aborting the host. Never a default feature, never
# enabled by packaging/install scripts (enforced by tests/invariants).
fault-injection = []

[dependencies]
soos-protocol = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
pam_bindings = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]

[lints]
workspace = true
