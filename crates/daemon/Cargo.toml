[package]
name = "soos-daemon"
description = "Privileged background daemon for soos local biometric PAM verification"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "soos-daemon"
path = "src/main.rs"

[lib]
name = "soos_daemon"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
nix = { workspace = true, features = ["time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
soos-protocol = { workspace = true }
soos-policy = { workspace = true }
soos-camera-v4l = { workspace = true }
soos-inference-ort = { workspace = true }
soos-vision = { workspace = true }
soos-biometric-store = { workspace = true }
soos-evidence-store = { workspace = true }
postcard = { workspace = true }
libc = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
