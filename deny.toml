# =============================================================================
# deny.toml — Configuration cargo-deny pour le projet soos
# =============================================================================
# Audit des dépendances : licences, vulnérabilités connues, sources autorisées.
# Exécuté en CI (GitHub Actions) et localement :
#   cargo deny check
# =============================================================================

[graph]
all-features = true

# ---------------------------------------------------------------------------
# Advisories — Vulnérabilités connues (RustSec Advisory DB)
# ---------------------------------------------------------------------------
[advisories]
yanked = "deny"
ignore = []

# ---------------------------------------------------------------------------
# Licences — Seules les licences OSS permissives sont autorisées
# ---------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.8

allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
]

[licenses.private]
# Ignore les crates internes du workspace qui ne sont pas publiées sur crates.io
ignore = true

# ---------------------------------------------------------------------------
# Sources — N'autoriser que crates.io
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# ---------------------------------------------------------------------------
# Bans — Crates interdites explicitement
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"

deny = [
    # ARCHITECTURE.md : "Interdiction absolue d'OpenCV"
    { crate = "opencv", reason = "Interdiction absolue OpenCV (ARCHITECTURE.md)" },
]
