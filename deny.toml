# =============================================================================
# deny.toml — cargo-deny Configuration for soos
# =============================================================================
# Dependency auditing: licenses, known vulnerabilities, and authorized sources.
# Executed in CI (GitHub Actions) and locally:
#   cargo deny check
# =============================================================================

[graph]
all-features = true

# ---------------------------------------------------------------------------
# Advisories — Known vulnerabilities (RustSec Advisory Database)
# ---------------------------------------------------------------------------
[advisories]
yanked = "deny"
ignore = []

# ---------------------------------------------------------------------------
# Licenses — Only permissive OSS licenses are permitted
# ---------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"

allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[licenses.private]
# Ignore internal workspace crates that are not published to crates.io
ignore = true

# ---------------------------------------------------------------------------
# Sources — Only allow crates.io
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# ---------------------------------------------------------------------------
# Bans — Explicitly prohibited crates
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "deny"
wildcards = "deny"

# Skip reasons are derived from `cargo tree --locked -i <crate>@<version> --target all
# -e normal,build,dev --depth 1` and name the direct dependents of the skipped version
# (enforced by tests/invariants/src/dependency_tooling_contract.rs). Rewrite a reason
# whenever `cargo update` changes who pulls the old version in.
#
# Crates locked in three versions (each version is documented here):
#   getrandom@0.4.3        kept (not skipped): direct dependency of soos-admin-cli,
#                          soos-biometric-store, soos-enrollment-cli, soos-evidence-store,
#                          soos-gui and soos-pam, and of tempfile (dev-dependency)
#   getrandom@0.3.4        skipped: ahash (egui/eframe/winit) and rand_core 0.9 (proptest)
#   getrandom@0.2.17       skipped: rand_core 0.6 (crypto-common via aes-gcm)
#   redox_syscall@0.9.4    kept: libredox
#   windows-sys@0.61.2     kept: tokio, mio, socket2, rustix 1, tempfile, eframe and others
skip = [
    { crate = "bitflags@1.3.2", reason = "Used by bindgen 0.65 (build dependency of v4l2-sys-mit via v4l), v4l, redox_syscall 0.4 and core-graphics/core-graphics-types (winit on macOS)" },
    { crate = "getrandom@0.2.17", reason = "Transitive: rand_core 0.6 (crypto-common 0.1 via aes-gcm); workspace crates use getrandom 0.4" },
    { crate = "getrandom@0.3.4", reason = "Transitive: ahash (egui/eframe/winit) and rand_core 0.9 (proptest dev-dependency); workspace crates use getrandom 0.4" },
    { crate = "linux-raw-sys@0.4.15", reason = "Used by rustix 0.38 while rustix 1 uses linux-raw-sys 0.12" },
    { crate = "r-efi@5.3.0", reason = "Used by getrandom 0.3 (UEFI targets only) while getrandom 0.4 uses r-efi 6" },
    { crate = "rustix@0.38.44", reason = "Used by which 4 (bindgen 0.65 via v4l2-sys-mit), calloop 0.13, calloop-wayland-source 0.3, smithay-client-toolkit 0.19 and winit 0.30" },
    { crate = "shlex@1.3.0", reason = "Used by bindgen 0.65 (build dependency of v4l2-sys-mit 0.3 via v4l)" },
    { crate = "syn@2.0.119", reason = "Used by bindgen, prettyplease, thiserror-impl 1, tracing-attributes, pin-project-internal, num_enum_derive, openssl-macros and jni macros while thiserror/clap use syn 3" },
    { crate = "windows-sys@0.59.0", reason = "Used by rustix 0.38 and arboard (Windows targets only)" },
    { crate = "windows-sys@0.52.0", reason = "Used by winit, glutin and glutin_egl_sys (Windows targets only)" },
    { crate = "block2@0.5.1", reason = "Used by winit 0.30 and objc2-foundation 0.2 (Apple targets only)" },
    { crate = "calloop@0.13.0", reason = "Used by winit 0.30, smithay-client-toolkit 0.19 and calloop-wayland-source 0.3" },
    { crate = "calloop-wayland-source@0.3.0", reason = "Used by smithay-client-toolkit 0.19 (winit 0.30)" },
    { crate = "core-foundation@0.9.4", reason = "Used by winit 0.30, core-graphics and core-graphics-types (macOS only)" },
    { crate = "der@0.7.10", reason = "Used by ecdsa 0.16 and sec1 0.7 (p256 0.13 via soos-remote) while ureq 3 (build dependency of ort-sys) uses der 0.8" },
    { crate = "foreign-types@0.3.2", reason = "Used by openssl (native-tls via the ureq build dependency of ort-sys)" },
    { crate = "foreign-types-shared@0.1.1", reason = "Used by foreign-types 0.3 (openssl)" },
    { crate = "jni-sys@0.3.1", reason = "Used by ndk 0.9 and ndk-sys 0.6 (winit on Android only)" },
    { crate = "miniz_oxide@0.8.9", reason = "Used by png 0.18 (image via eframe/arboard)" },
    { crate = "objc2@0.5.2", reason = "Used by winit 0.30, block2 0.5 and objc2-app-kit/objc2-foundation/objc2-ui-kit 0.2 (Apple targets only)" },
    { crate = "objc2-app-kit@0.2.2", reason = "Used by winit 0.30 (macOS only)" },
    { crate = "objc2-foundation@0.2.2", reason = "Used by winit 0.30, objc2-app-kit 0.2 and objc2-ui-kit 0.2 (Apple targets only)" },
    { crate = "objc2-ui-kit@0.2.2", reason = "Used by winit 0.30 (iOS only)" },
    { crate = "redox_syscall@0.4.1", reason = "Used by winit 0.30 (Redox targets only)" },
    { crate = "redox_syscall@0.5.18", reason = "Used by parking_lot_core (Redox targets only)" },
    { crate = "smithay-client-toolkit@0.19.2", reason = "Used by winit 0.30 while smithay-clipboard uses 0.20" },
    { crate = "thiserror@1.0.69", reason = "Used by calloop 0.13, ndk 0.9 and smithay-client-toolkit 0.19 while the workspace uses thiserror 2" },
    { crate = "thiserror-impl@1.0.69", reason = "Used by thiserror 1 (calloop, ndk, smithay-client-toolkit)" },
    { crate = "toml_datetime@0.6.11", reason = "Used by toml 0.8 and toml_edit 0.22 (workspace toml 0.8)" },
    { crate = "toml_edit@0.22.27", reason = "Used by toml 0.8 (workspace toml 0.8)" },
    { crate = "winnow@0.7.15", reason = "Used by toml_edit 0.22 (toml 0.8)" },
]

deny = [
    # ARCHITECTURE.md: "Strict prohibition against OpenCV"
    { crate = "opencv", reason = "Strict prohibition against OpenCV (ARCHITECTURE.md)" },
    # ARCHITECTURE.md: "Root daemon is exclusive owner of /dev/video*. v4l crate in production, not nokhwa."
    { crate = "nokhwa", reason = "Strict prohibition against Nokhwa camera crate; v4l required (ARCHITECTURE.md)" },
]
