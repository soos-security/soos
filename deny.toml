# =============================================================================
# deny.toml — cargo-deny Configuration for soos
# =============================================================================
# Dependency auditing: licenses, known vulnerabilities, and authorized sources.
# Executed in CI (GitHub Actions) and locally:
#   cargo deny check
# =============================================================================

[graph]
all-features = true

# ---------------------------------------------------------------------------
# Advisories — Known vulnerabilities (RustSec Advisory Database)
# ---------------------------------------------------------------------------
[advisories]
yanked = "deny"
ignore = []

# ---------------------------------------------------------------------------
# Licenses — Only permissive OSS licenses are permitted
# ---------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"

allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[licenses.private]
# Ignore internal workspace crates that are not published to crates.io
ignore = true

# ---------------------------------------------------------------------------
# Sources — Only allow crates.io
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# ---------------------------------------------------------------------------
# Bans — Explicitly prohibited crates
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "deny"
wildcards = "deny"

skip = [
    { crate = "bitflags@1.3.2", reason = "Transitive dependency of bindgen 0.65 via v4l2-sys-mit 0.3.0" },
    { crate = "getrandom@0.2.17", reason = "Transitive dependency of crypto-common 0.1 via aes-gcm" },
    { crate = "getrandom@0.3.4", reason = "Transitive dependency of rand_core 0.9 via proptest" },
    { crate = "linux-raw-sys@0.4.15", reason = "Transitive dependency of rustix 0.38 via bindgen 0.65" },
    { crate = "r-efi@5.3.0", reason = "Transitive dependency of getrandom 0.3" },
    { crate = "rustix@0.38.44", reason = "Transitive dependency of bindgen 0.65 via v4l2-sys-mit 0.3.0" },
    { crate = "shlex@1.3.0", reason = "Transitive dependency of bindgen 0.65 via v4l2-sys-mit 0.3.0" },
    { crate = "syn@2.0.119", reason = "Transitive dependency of bindgen and zerocopy while thiserror/clap use syn 3" },
    { crate = "windows-sys@0.59.0", reason = "Transitive dependency of bindgen 0.65 via v4l2-sys-mit 0.3.0" },
    { crate = "windows-sys@0.52.0", reason = "Transitive dependency of winit and parking_lot" },
    { crate = "block2@0.5.1", reason = "Transitive dependency of winit/objc2 on macOS" },
    { crate = "calloop@0.13.0", reason = "Transitive dependency of smithay-client-toolkit 0.19" },
    { crate = "calloop-wayland-source@0.3.0", reason = "Transitive dependency of smithay-client-toolkit 0.19" },
    { crate = "core-foundation@0.9.4", reason = "Transitive dependency of security-framework on macOS" },
    { crate = "foreign-types@0.3.2", reason = "Transitive dependency of native-tls" },
    { crate = "foreign-types-shared@0.1.1", reason = "Transitive dependency of native-tls" },
    { crate = "jni-sys@0.3.1", reason = "Transitive dependency of android-activity" },
    { crate = "miniz_oxide@0.8.9", reason = "Transitive dependency of flate2" },
    { crate = "objc2@0.5.2", reason = "Transitive dependency of winit on macOS" },
    { crate = "objc2-app-kit@0.2.2", reason = "Transitive dependency of winit on macOS" },
    { crate = "objc2-foundation@0.2.2", reason = "Transitive dependency of winit on macOS" },
    { crate = "objc2-ui-kit@0.2.2", reason = "Transitive dependency of winit on iOS" },
    { crate = "redox_syscall@0.4.1", reason = "Transitive dependency of redox targets" },
    { crate = "redox_syscall@0.5.18", reason = "Transitive dependency of redox targets" },
    { crate = "smithay-client-toolkit@0.19.2", reason = "Transitive dependency of smithay-clipboard" },
    { crate = "thiserror@1.0.69", reason = "Transitive dependency of image/glutin while workspace uses thiserror 2" },
    { crate = "thiserror-impl@1.0.69", reason = "Transitive dependency of image/glutin while workspace uses thiserror 2" },
    { crate = "toml_datetime@0.6.11", reason = "Transitive dependency of toml 0.8" },
    { crate = "toml_edit@0.22.27", reason = "Transitive dependency of toml 0.8" },
    { crate = "winnow@0.7.15", reason = "Transitive dependency of toml_edit 0.22" },
]

deny = [
    # ARCHITECTURE.md: "Strict prohibition against OpenCV"
    { crate = "opencv", reason = "Strict prohibition against OpenCV (ARCHITECTURE.md)" },
    # ARCHITECTURE.md: "Root daemon is exclusive owner of /dev/video*. v4l crate in production, not nokhwa."
    { crate = "nokhwa", reason = "Strict prohibition against Nokhwa camera crate; v4l required (ARCHITECTURE.md)" },
]
